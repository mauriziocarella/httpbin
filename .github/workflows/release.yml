name: Release and deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing image tag to deploy
        required: true
        default: latest

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mauriziocarella/httpbin

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: always() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy deployment manifest
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "install -d /home/${{ secrets.VPS_USER }}/docker/httpbin"
          scp docker-compose.production.yml "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/docker/httpbin/docker-compose.yml"
      - name: Log in to GHCR on the VPS
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"
      - name: Deploy release
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "cd /home/${{ secrets.VPS_USER }}/docker/httpbin && HTTPBIN_IMAGE='${IMAGE}:${VERSION}' docker compose pull && HTTPBIN_IMAGE='${IMAGE}:${VERSION}' docker compose up -d --remove-orphans && docker logout ghcr.io"
      - name: Verify deployment
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "for attempt in 1 2 3 4 5 6; do status=\$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' httpbin-tools-httpbin-1 2>/dev/null || true); [ \"\$status\" = healthy ] && exit 0; sleep 5; done; docker compose -f /home/${{ secrets.VPS_USER }}/docker/httpbin/docker-compose.yml logs --tail=100; exit 1"
