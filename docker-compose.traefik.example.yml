name: webhook-inspector

services:
  httpbin:
    image: ghcr.io/your-user/httpbin:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      MAX_EVENTS_PER_ENDPOINT: 500
      DEFAULT_RETENTION_HOURS: 168
      MAX_PAYLOAD_BYTES: 2097152
      HOOK_RATE_LIMIT_PER_MINUTE: 120
      TRUST_PROXY: 172.16.0.0/12
    volumes:
      - httpbin-data:/app/data
    networks:
      - http-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=http-proxy
      - traefik.http.routers.webhook-inspector.rule=Host(`webhook.example.com`)
      - traefik.http.routers.webhook-inspector.entrypoints=websecure
      - traefik.http.routers.webhook-inspector.tls.certresolver=letsencrypt
      - traefik.http.services.webhook-inspector.loadbalancer.server.port=3000

volumes:
  httpbin-data:

networks:
  http-proxy:
    external: true
